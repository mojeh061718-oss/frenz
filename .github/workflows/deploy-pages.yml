name: Deploy frenz to GitHub Pages

# Publishes the app on every push. `configure-pages` with enablement turns
# Pages on the first time this runs, so no manual setup is needed.
on:
  push:
    branches:
      - main
      - claude/friendship-companion-pwa-vj0414
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      # The app is static — no build step. Publish the repo root as-is.
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
